services:
  - type: web
    name: vyaparsetu-backend
    runtime: docker
    plan: starter
    region: singapore
    branch: master
    healthCheckPath: /health
    disk:
      name: vyaparsetu-storage
      mountPath: /app/backend/storage
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: AI_MODE
        value: PRODUCTION_BHARATCODE
      - key: BHARATCODE_BASE_URL
        value: https://bharatcode.ai/api/model/v1
      - key: BHARATCODE_MODEL_NAME
        value: qwen-3.8-27b
      - key: BHARATCODE_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:////app/backend/storage/vyaparsetu.db
      - key: CHROMADB_DIR
        value: /app/backend/storage/chromadb
      - key: STORAGE_DIR
        value: /app/backend/storage
